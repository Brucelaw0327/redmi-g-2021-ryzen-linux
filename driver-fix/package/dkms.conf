PACKAGE_NAME="bitland-mifs-wmi"
PACKAGE_VERSION="1.1"

# 修复：Redmi G 2021 (TM2037) 的 EC 对 WMI_FN_SYSTEM_AC_TYPE 返回 0，
# 原驱动要求必须等于 WMI_SYSTEM_AC_CIRCULARHOLE(2)，导致
# balanced-performance / performance 两档一律 -EOPNOTSUPP。
# 本补丁仅在明确报告 Type-C(1) 时拒绝。
#
# 注意：dkms 会按内核的 CONFIG_CC_IS_CLANG 自动追加 LLVM=1，
# 这里不要自己写，否则会被拼到命令尾部造成语法错误。

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

BUILT_MODULE_NAME[0]="bitland-mifs-wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
